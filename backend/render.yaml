services:
  - type: web
    name: sentinelhome-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn app.main:app --bind 0.0.0.0:$PORT --timeout 180 --workers 1 --threads 2 --max-requests 100 --max-requests-jitter 20
    envVars:
      - key: PERSISTENCE
        value: mongo
      - key: MONGO_DB_NAME
        value: sentinelhome
      - key: MONGO_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: MONITOR_INTERVAL_MINUTES
        value: "30"
